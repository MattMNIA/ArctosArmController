# Gesture recognition configuration for finger teleoperation
model:
  path: models/gesture_classifier.joblib
  probability_threshold: 0.5
  smoothing_window: 3
  min_consensus: 2
  max_history: 21

# Each gesture maps a classifier label to a teleoperation event.
gestures:
  - label: rock_and_roll
    event: zero_all_joints
    hands_required: 1
    hold_frames: 3
    overlay: "Rock & Roll ➜ Zero"
  - label: thumbs_down
    event: teleop_pause
    hands_required: 1
    hold_frames: 3
    overlay: "Thumbs Down (1 hand) ➜ Pause"
  - label: thumbs_up
    event: teleop_resume
    hands_required: 1
    hold_frames: 3
    overlay: "Thumbs Up (1 hand) ➜ Resume"
